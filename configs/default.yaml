# default.yaml — master config for the traffic-shockwave-forecasting pipeline
# All paths are relative to the project root.

data:
  raw_dir: data/raw
  processed_dir: data/processed
  pems_bay_dir: data/raw/augmented-pems-bay
  weather_csv: data/raw/weather/weather_hourly.csv
  events_csv: data/raw/events/events.csv

  freq_min: 5              # target sampling interval (minutes)
  date_range:
    start: "2017-01-01"
    end: "2017-06-30"

  split:
    train: 0.70
    val: 0.10
    test: 0.20

  windows:
    input: 12              # 60 min of history
    horizon: 12            # 60 min ahead

seed: 42
n_seeds: 3                 # runs per config for mean ± std
