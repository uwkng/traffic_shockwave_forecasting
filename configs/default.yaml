# default.yaml — master config for the traffic-shockwave-forecasting pipeline
# All paths are relative to the project root.

data:
  raw_dir: data/raw
  processed_dir: data/processed
  pems_bay_dir: data/raw/augmented-pems-bay
  weather_csv: data/raw/weather/weather_hourly.csv
  events_csv: data/raw/events/events.csv

  freq_min: 5              # target sampling interval (minutes)
  date_range:
    start: "2017-01-01"
    end: "2017-06-30"

  split:
    train: 0.70
    val: 0.10
    test: 0.20

  windows:
    input: 12              # 60 min of history
    horizon: 12            # 60 min ahead

model:
  stgcn:
    Kt: 3                  # temporal conv kernel size
    Ks: 3                  # Chebyshev polynomial order
    blocks: [[1, 64, 64], [64, 64, 64]]   # [c_in, c_mid, c_out] per ST-Conv block
    dropout: 0.3

training:
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 64
  epochs: 200
  patience: 20
  scheduler:
    step_size: 10
    gamma: 0.7
  checkpoint_dir: checkpoints

seed: 42
n_seeds: 3                 # runs per config for mean ± std
